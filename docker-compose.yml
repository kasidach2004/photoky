services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photoky_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_NAME=${DB_NAME:-photoky}
      - DB_USER=${DB_USER:-photoky_user}
      - DB_PASS=${DB_PASS:-photoky_pass}
      - DB_PORT=${DB_PORT:-3306}
      - APP_ENV=${APP_ENV:-production}
      - APP_URL=${APP_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - photoky_network

  db:
    image: mysql:8.0
    container_name: photoky_db
    hostname: db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-photoky_root_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-photoky}
      MYSQL_USER: ${MYSQL_USER:-photoky_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-photoky_pass}
    volumes:
      - photoky_db_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pphotoky_root_secret"]
      interval: 4s
      timeout: 4s
      retries: 15
      start_period: 12s
    networks:
      photoky_network:
        aliases:
          - db
          - photoky_db

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: photoky_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 16M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - photoky_network

networks:
  photoky_network:
    driver: bridge

volumes:
  photoky_db_data:
    driver: local
